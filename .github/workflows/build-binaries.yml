name: Build SecAI binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-14
            target: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node scripts/build-release.mjs
        env:
          SECAI_SKIP_BINARY_SMOKE: '1'

      - uses: actions/upload-artifact@v4
        with:
          name: secai-${{ matrix.target }}
          path: |
            dist/artifacts/secai-*-${{ matrix.target }}.tar.gz
            dist/artifacts/secai-*-${{ matrix.target }}-installer.sh
            dist/artifacts/secai-*-${{ matrix.target }}.zip
            dist/artifacts/secai-*-${{ matrix.target }}-installer.ps1
            dist/update/secai-cli/**
          if-no-files-found: error
